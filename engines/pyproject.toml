[project]
name = "ocr-playground"
version = "0.1.0"
description = "Run and compare OCR engines on the same documents"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=11",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
openthai-text = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.8",
    "pyclipper>=1.3",
    "onnxruntime>=1.17",
    "huggingface-hub>=0.24",
]
# openthai-markdown talks to a vLLM server; openthai-markdown-local runs the model on this machine with Transformers.
# Both load iapp's nemotron_parse client from the downloaded model folder.
openthai-markdown = ["httpx>=0.27", "numpy>=2.0,<3", "beautifulsoup4>=4.13", "huggingface-hub>=0.24"]
openthai-markdown-local = [
    "torch>=2.11,<2.14",
    "torchvision>=0.26,<0.29",
    "transformers>=5.14.1,<5.20",
    "accelerate>=1.12",
    "timm>=1.0.22,<1.1",
    "einops>=0.8",
    "safetensors>=0.8",
    "numpy>=2.0,<3",
    "beautifulsoup4>=4.13",
    "huggingface-hub>=1.24,<2",
]
typhoon = ["typhoon-ocr>=0.4.1"]
synth = ["numpy>=2.0,<3", "uharfbuzz>=0.40", "freetype-py>=2.4"]

[project.scripts]
ocr = "ocr_playground.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_playground"]

# CUDA 12.6 builds of torch on Windows and Linux; macOS takes the PyPI build (CPU or MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
