[project]
name = "ocr-playground"
version = "0.1.0"
description = "Run and compare OCR engines on the same documents"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=11",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
openthai-text = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.8",
    "pyclipper>=1.3",
    "onnxruntime>=1.17",
    "huggingface-hub>=0.24",
]
# openthai-markdown talks to a vLLM server; openthai-markdown-local runs the model on this machine with Transformers.
# Both load iapp's nemotron_parse client from the downloaded model folder.
openthai-markdown = ["httpx>=0.27", "numpy>=2.0,<3", "beautifulsoup4>=4.13", "huggingface-hub>=0.24"]
openthai-markdown-local = [
    "torch>=2.11,<2.14",
    "torchvision>=0.26,<0.29",
    "transformers>=5.14.1,<5.20",
    "accelerate>=1.12",
    "timm>=1.0.22,<1.1",
    "einops>=0.8",
    "safetensors>=0.8",
    "numpy>=2.0,<3",
    "beautifulsoup4>=4.13",
    "huggingface-hub>=1.24,<2",
]
typhoon = ["typhoon-ocr>=0.4.1"]
synth = ["numpy>=2.0,<3", "uharfbuzz>=0.40", "freetype-py>=2.4"]

[project.scripts]
ocr = "ocr_playground.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "import-linter>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_playground"]

# CUDA 12.6 builds of torch on Windows and Linux; macOS takes the PyPI build (CPU or MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# `uv run lint-imports` checks the module boundaries. Tests are outside the root package, so they may deep-import.
[tool.importlinter]
root_package = "ocr_playground"

# Rule 1: a module imports only modules in layers below it. A new top-level module must be added here (exhaustive).
[[tool.importlinter.contracts]]
name = "Layers: cli, api > bench > engines, scoring, synth > config"
type = "layers"
containers = ["ocr_playground"]
layers = ["cli : api", "bench", "engines : scoring : synth", "config"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "engines, scoring and synth are independent of each other"
type = "independence"
modules = ["ocr_playground.engines", "ocr_playground.scoring", "ocr_playground.synth"]

# Rule 2: outside a module, import only its package root (`from ocr_playground.engines import get_engine`).
# Whatever another module needs goes into that module's `__init__`.
[[tool.importlinter.contracts]]
name = "Only engines imports its own submodules"
type = "protected"
protected_modules = ["ocr_playground.engines.*"]
allowed_importers = ["ocr_playground.engines"]

[[tool.importlinter.contracts]]
name = "Only scoring imports its own submodules"
type = "protected"
protected_modules = ["ocr_playground.scoring.*"]
allowed_importers = ["ocr_playground.scoring"]

[[tool.importlinter.contracts]]
name = "Only synth imports its own submodules"
type = "protected"
protected_modules = ["ocr_playground.synth.*"]
allowed_importers = ["ocr_playground.synth"]

[[tool.importlinter.contracts]]
name = "Only bench imports its own submodules"
type = "protected"
protected_modules = ["ocr_playground.bench.*"]
allowed_importers = ["ocr_playground.bench"]

[[tool.importlinter.contracts]]
name = "Only api imports its own submodules"
type = "protected"
protected_modules = ["ocr_playground.api.*"]
allowed_importers = ["ocr_playground.api"]
