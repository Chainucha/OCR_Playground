version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            - nvm install 22 && nvm use 22
            # Not `npm ci`: npm rejects this lock file's bundled Amplify dependencies as out of sync, even a fresh one.
            - npm install --no-audit --no-fund --cache .npm --prefer-offline
            # Deploys the Cognito user pool (amplify/) and writes amplify_outputs.json for the build below.
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
        build:
          commands:
            # NEXT_PUBLIC_* variables (the engine API URL) are read here and baked into the bundle.
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
